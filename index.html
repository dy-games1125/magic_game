<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ARCANE LOG — 마법 조합 로그라이크</title>
<style>
:root{--bg:#090d1b;--panel:#111a30;--panel2:#182441;--line:#304267;--text:#eef4ff;--muted:#9eafd0;--gold:#ffd36a;--cyan:#72e6ff;--purple:#c59aff;--red:#ff687d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:pan-x pan-y}
button{font:inherit;color:inherit;border:1px solid var(--line);background:#202e4d;border-radius:12px;padding:10px 14px;cursor:pointer;transition:.12s}
button:hover{filter:brightness(1.15)}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:linear-gradient(135deg,#6c54d9,#2879b9);border-color:#7b8dff;font-weight:800}.gold{background:linear-gradient(135deg,#8c5b1e,#c38a2e);border-color:#f1c96c}.danger{background:#57243b;border-color:#a64b67}.small{padding:6px 9px;font-size:12px}.hidden{display:none!important}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#172346 0,#090d1b 65%)}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.menu-card{width:min(900px,100%);max-height:100%;overflow:auto;background:linear-gradient(150deg,rgba(20,30,56,.97),rgba(9,14,29,.98));border:1px solid #394c77;border-radius:24px;padding:clamp(16px,3vw,30px);box-shadow:0 20px 80px #0009}
.logo{text-align:center;font-size:clamp(32px,7vw,66px);letter-spacing:.12em;font-weight:1000;background:linear-gradient(90deg,#e7f8ff,#9c9dff,#ffdb8a);color:transparent;background-clip:text;text-shadow:0 0 40px #6e8cff25}
.subtitle{text-align:center;color:#aabce4;margin:6px 0 20px}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mode{min-height:130px;text-align:left;padding:18px;background:linear-gradient(145deg,#202e51,#111a30);border-radius:16px}.mode.selected{outline:3px solid #8e91ff;background:linear-gradient(145deg,#35366c,#172848)}.mode .emoji{font-size:32px}.mode strong{display:block;font-size:20px;margin:5px 0}.mode small{color:var(--muted);line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#182442;border-radius:99px;padding:5px 9px;font-size:12px}
#gameScreen{position:absolute;inset:0;display:none;background:#090d1b}#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud-left,.hud-right{display:flex;gap:7px;flex-wrap:wrap;max-width:48%}.hud-chip{background:#0b1227dd;border:1px solid #3a4d77;border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:0 4px 12px #0004}.hud-chip b{color:#fff}
#hpBar{width:160px;height:9px;border-radius:9px;background:#42283b;overflow:hidden;margin-top:5px}#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#ff526d,#ff9c86)}
#skillSlots{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);display:flex;gap:6px;z-index:5;pointer-events:auto;max-width:72%;justify-content:center}
#skillSlots button{width:48px;height:44px;padding:2px 3px;border-radius:10px;background:#101a31ee;border:2px solid #6b7ca5;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;touch-action:manipulation}
#skillSlots button.active{background:#30365f;border-color:#ffe18a;box-shadow:0 0 12px #b5a0ff55}
#skillSlots button .skill-icon{font-size:19px}#skillSlots button .skill-key{font-size:9px;color:#c2cee8}
#xpWrap{position:absolute;left:0;right:0;bottom:0;height:5px;background:#182440;z-index:3}#xpFill{height:100%;width:0;background:linear-gradient(90deg,#64d9ff,#c59aff)}
#gameButtons{position:absolute;right:12px;top:65px;display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:55%}#gameButtons button{padding:7px 10px;background:#0e1830dd;font-size:12px}
#touchControls{position:absolute;inset:0;pointer-events:none;display:none;user-select:none;-webkit-user-select:none}
#stickBase{position:absolute;left:22px;bottom:30px;width:130px;height:130px;border-radius:50%;background:#dbe8ff18;border:2px solid #dbe8ff55;pointer-events:auto;touch-action:none}
#stickKnob{position:absolute;width:54px;height:54px;left:36px;top:36px;border-radius:50%;background:#d5e6ff88;border:2px solid #fff9;box-shadow:0 0 18px #9edbff44}
.touch-actions{position:absolute;right:20px;bottom:24px;display:grid;grid-template-columns:repeat(2,70px);gap:10px;pointer-events:auto}
.touch-actions button{height:64px;border-radius:50%;font-size:13px;font-weight:800;padding:4px;background:#17264ddd;border:2px solid #8b9fdc;touch-action:none;box-shadow:0 4px 16px #0006}
.touch-actions .attack{background:#5c2f74dd;border-color:#e0a8ff}.touch-actions .dash{background:#1d5471dd;border-color:#8ceaff}
#modalLayer{position:absolute;inset:0;background:#030713aa;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
.modal{width:min(760px,100%);max-height:90%;overflow:auto;background:linear-gradient(145deg,#172342,#0c1327);border:1px solid #465b8b;border-radius:20px;padding:18px;box-shadow:0 18px 70px #000b}
.modal h2{margin:0 0 6px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-top:14px}.pick-card{padding:13px;text-align:left;min-height:125px;background:linear-gradient(145deg,#26365a,#141e38)}.pick-card .icon{font-size:27px}.pick-card b{display:block;margin:5px 0}.pick-card small{color:#b7c5e4;line-height:1.4}.rarity-일반{border-color:#6c7b99}.rarity-희귀{border-color:#5ab8df}.rarity-영웅{border-color:#aa7dff}.rarity-전설{border-color:#ffbd59;box-shadow:inset 0 0 20px #ffbd5910}.rarity-신화{border-color:#ff688e;box-shadow:inset 0 0 20px #ff688e12}.rarity-초월{border-color:#fff1a1;box-shadow:inset 0 0 24px #b69aff24}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:#111c34ee;border:1px solid #8199cf;border-radius:12px;padding:10px 16px;z-index:20;display:none;text-align:center;max-width:90%;box-shadow:0 8px 30px #0008}
#levelBanner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);font-size:clamp(24px,5vw,42px);font-weight:1000;color:#ffe58b;text-shadow:0 0 22px #ffae42;display:none;z-index:5;pointer-events:none}
@media(max-width:700px){#skillSlots{bottom:88px;gap:4px}#skillSlots button{width:43px;height:40px}#skillSlots button .skill-icon{font-size:17px}.menu-card{border-radius:18px}.mode{padding:12px;min-height:118px}.mode strong{font-size:17px}.hud-chip{padding:6px 8px;font-size:11px}.hud-left,.hud-right{max-width:55%}#gameButtons{top:72px;max-width:65%}#stickBase{width:112px;height:112px;left:14px;bottom:18px}#stickKnob{left:29px;top:29px;width:50px;height:50px}.touch-actions{right:12px;bottom:14px;grid-template-columns:repeat(2,61px);gap:7px}.touch-actions button{height:58px;font-size:11px}}
@media(orientation:portrait) and (max-width:700px){#rotateHint{display:block!important}}
#rotateHint{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#080e20ee;border:1px solid #6d81b1;border-radius:14px;padding:12px 16px;z-index:30;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <section id="startScreen" class="screen">
    <div class="menu-card">
      <div class="logo">ARCANE LOG</div>
      <div class="subtitle">마법을 발견하고, 융합하고, 초월하라</div>
      <div class="row between" style="margin-bottom:12px"><b>플레이 모드를 선택해</b><span class="pill">저장 자동 지원</span></div>
      <div class="mode-grid">
        <button class="mode selected" id="pcMode"><span class="emoji">🖥️</span><strong>컴퓨터 모드</strong><small>WASD 이동 · 마우스 조준/공격<br>Space 대시 · E 스킬 · 메뉴 클릭</small></button>
        <button class="mode" id="tabletMode"><span class="emoji">📱</span><strong>태블릿 모드</strong><small>가상 조이스틱 이동<br>공격 · 대시 · 스킬 버튼 터치</small></button>
      </div>
      <div class="row" style="margin-top:16px">
        <label class="muted" for="difficulty">난이도</label>
        <select id="difficulty" style="flex:1;min-width:140px;background:#111a30;color:white;border:1px solid #40557d;border-radius:10px;padding:10px">
          <option value="easy">모험가 (쉬움)</option><option value="normal" selected>마법사 (보통)</option><option value="hard">대마법사 (어려움)</option><option value="nightmare">악몽 (매우 어려움)</option>
        </select>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="primary" id="startBtn" style="flex:1;font-size:18px;padding:14px">게임 시작</button>
        <button id="continueBtn" style="flex:1;padding:14px">저장 불러오기</button>
      </div>
      <div class="row between" style="margin-top:15px">
        <span class="tiny">20종 융합 마법 · 보스 10종 · 스킬 뽑기 · 영구 성장</span>
        <button id="resetSave" class="small danger">저장 초기화</button>
      </div>
    </div>
  </section>
  <section id="gameScreen">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div class="hud-left">
        <div class="hud-chip"><b id="levelText">Lv. 1</b><div id="hpBar"><div id="hpFill"></div></div><span id="hpText">100 / 100 HP</span></div>
        <div class="hud-chip">🌀 <b id="stageText">던전 1</b><br><span id="waveText">웨이브 1</span></div>
      </div>
      <div class="hud-right">
        <div class="hud-chip">💠 <b id="manaText">0</b></div>
        <div class="hud-chip">💰 <b id="goldText">0</b></div>
        <div class="hud-chip">☠ <b id="killText">0</b></div>
      </div>
    </div>
    <div id="gameButtons">
      <button id="pauseBtn">Ⅱ 일시정지</button><button id="spellBookBtn">✦ 마법</button><button id="summonBtn">🎲 뽑기</button><button id="codexBtn">📖 도감</button><button id="shopBtn">⬆ 성장</button>
    </div>
    <div id="touchControls">
      <div id="stickBase"><div id="stickKnob"></div></div>
      <div class="touch-actions"><button class="attack" id="touchAttack">✦<br>공격</button><button class="dash" id="touchDash">➤<br>대시</button><button id="touchSkill">✧<br>스킬</button><button id="touchMenu">☰<br>메뉴</button></div>
    </div>
    <div id="skillSlots" aria-label="장착 마법 슬롯"></div>
    <div id="xpWrap"><div id="xpFill"></div></div>
    <div id="levelBanner">LEVEL UP!</div>
    <div id="rotateHint">📱 태블릿은 가로 화면으로 플레이하면 더 좋아요.</div>
  </section>
  <div id="modalLayer"><div class="modal" id="modal"></div></div>
  <div id="toast"></div>
</div>
<script>

 }
 const target=nearestEnemy(player.x,player.y);if(!target){burst(player.x,player.y,s.color,5);return}
 let dx=target.x-player.x,dy=target.y-player.y,d=Math.hypot(dx,dy)||1;projectiles.push({x:player.x,y:player.y,vx:dx/d*420,vy:dy/d*420,r:id==='dragon'?11:7,damage:s.damage*player.damage*(1+(state.damageBonus||0)),life:1.8,color:s.color,spell:id,pierce:['ice','light','arcane','dragon','sunbeam'].includes(id)?3:0,homing:['spirit','dragon'].includes(id)});
}
function hitEnemy(e,dmg){if(!enemies.includes(e))return;e.hp-=dmg;showFloat(e.x,e.y-e.r,String(Math.round(dmg)),e.color);burst(e.x,e.y,e.color,3);if(e.hp<=0){const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);state.kills++;const earnedGold=e.boss?80:4+Math.floor(Math.random()*4);const earnedMana=e.boss?35:(Math.random()<.25?2:0);state.runGold+=earnedGold;state.runMana+=earnedMana;save.gold+=earnedGold;save.mana+=earnedMana;gems.push({x:e.x,y:e.y,r:e.boss?8:5,xp:e.boss?45:8});if(e.boss){state.wave++;state.stage=Math.floor((state.wave-1)/5)+1;toast('보스 처치! 골드 +'+earnedGold+' · 마력석 +'+earnedMana);}else{showFloat(e.x,e.y-18,'+'+earnedGold+' 골드','#ffd36a');if(earnedMana)showFloat(e.x,e.y-34,'+'+earnedMana+' 마력석','#72e6ff');}persist();updateHUD()}}
function takeDamage(d){if(performance.now()<state.invuln)return;if(performance.now()<state.shieldUntil)d*=.3;player.hp-=d;state.invuln=performance.now()+600;burst(player.x,player.y,'#ff607d',10);if(player.hp<=0){player.hp=0;updateHUD();endRun()}}
function collect(){for(let i=gems.length-1;i>=0;i--){const g=gems[i];if(Math.hypot(g.x-player.x,g.y-player.y)<player.r+g.r+5){state.xp+=g.xp;gems.splice(i,1);if(state.xp>=state.xpNeed){state.xp-=state.xpNeed;state.level++;state.xpNeed=Math.floor(state.xpNeed*1.28+8);player.maxHp+=4;player.hp=Math.min(player.maxHp,player.hp+12);$('levelBanner').style.display='block';setTimeout(()=>$('levelBanner').style.display='none',900);chooseLevel()}}}}
function loop(now){if(!running)return;requestAnimationFrame(loop);const dt=Math.min(.035,(now-last)/1000||0);last=now;if(!paused&&!gameOver)update(dt,now);render();if(!paused&&!gameOver){autoSaveTimer+=dt;if(autoSaveTimer>8){persist();autoSaveTimer=0}}}
function update(dt,now){frame++;state.time+=dt;spawnTimer-=dt;if(spawnTimer<=0&&enemies.length<Math.min(38,8+state.wave*1.5)){let boss=state.wave%5===0&&!enemies.some(e=>e.boss);spawnEnemy(boss);spawnTimer=Math.max(.25,1.25-state.wave*.025)}
 let mx=0,my=0;if(mode==='pc'){if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;}else{mx=stick.x;my=stick.y}
 let l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}if(player.dash>0){player.x+=player.vx*dt;player.y+=player.vy*dt;player.dash-=dt}else{player.x+=mx*player.speed*dt;player.y+=my*player.speed*dt}
 player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(50,Math.min(H-player.r,player.y));if(player.dashCd>0)player.dashCd-=dt;
 for(const e of enemies){if(e.frozen>now)continue;let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;if(e.knock>0){e.x-=dx/d*e.knock*dt;e.y-=dy/d*e.knock*dt;e.knock-=dt*60}else{e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}if(d<e.r+player.r){takeDamage(e.damage*dt*2.2);if(e.boss&&Math.random()<.008){projectiles.push({x:e.x,y:e.y,vx:dx/d*-130,vy:dy/d*-130,r:7,damage:e.damage*.7,life:2,color:e.color,enemy:true})}}}
 for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.homing){const t=nearestEnemy(p.x,p.y);if(t){const d=Math.hypot(t.x-p.x,t.y-p.y)||1;p.vx+=(t.x-p.x)/d*100*dt;p.vy+=(t.y-p.y)/d*100*dt;const v=Math.hypot(p.vx,p.vy)||1;p.vx=p.vx/v*420;p.vy=p.vy/v*420}}
 if(p.enemy&&Math.hypot(p.x-player.x,p.y-player.y)<player.r+p.r){takeDamage(p.damage);projectiles.splice(i,1);continue}
 if(!p.enemy){let hit=false;for(const e of enemies){if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+p.r){hitEnemy(e,p.damage);if(p.pierce>0)p.pierce--;else hit=true;break}}if(hit){projectiles.splice(i,1);continue}}
 if(p.life<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50)projectiles.splice(i,1)}
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.97;p.vy*=.97}particles=particles.filter(p=>p.life>0);
 for(const f of floating){f.y-=25*dt;f.life-=dt}floating=floating.filter(f=>f.life>0);
 collect();if(mode==='pc'&&mouse.down&&now-(state.lastMouse||0)>130){castSpell(state.active[0]||'fire',mouse.x,mouse.y);state.lastMouse=now}
 if(mode==='tablet'&&touchAttack&&now-(state.lastTouch||0)>430){castSpell(state.active[0]||'fire');state.lastTouch=now}
 updateHUD()}
function render(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#111a32');bg.addColorStop(1,'#080d1a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // arena grid
 ctx.save();ctx.strokeStyle='#52648a18';ctx.lineWidth=1;const spacing=42,offset=(frame*.18)%spacing;for(let x=0;x<W;x+=spacing){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=spacing){ctx.beginPath();ctx.moveTo(0,y+offset);ctx.lineTo(W,y+offset);ctx.stroke()}ctx.restore();
 for(const g of gems){ctx.fillStyle='#7fe7ff';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e5fbff';ctx.stroke()}
 for(const p of projectiles){ctx.save();ctx.shadowBlur=18;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()}
 for(const e of enemies){ctx.save();ctx.shadowBlur=e.boss?24:8;ctx.shadowColor=e.color;ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#10172b';ctx.beginPath();ctx.arc(e.x-e.r*.28,e.y-e.r*.1,Math.max(2,e.r*.12),0,Math.PI*2);ctx.arc(e.x+e.r*.28,e.y-e.r*.1,Math.max(2,e.r*.12),0,Math.PI*2);ctx.fill();ctx.fillStyle='#293656';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);ctx.fillStyle=e.boss?'#ff617b':'#8dffb3';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*Math.max(0,e.hp/e.maxHp),4);if(e.boss){ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(e.name,e.x,e.y-e.r-15)}ctx.restore()}
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*1.7);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 for(const f of floating){ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.color;ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;
 if(player){ctx.save();if(performance.now()<state.shieldUntil){ctx.strokeStyle='#9deaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,player.r+9,0,Math.PI*2);ctx.stroke()}ctx.shadowBlur=22;ctx.shadowColor='#88b9ff';ctx.fillStyle=performance.now()<state.invuln?'#ffffff':'#b9d7ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#5b67a4';ctx.beginPath();ctx.arc(player.x+4,player.y-3,5,0,Math.PI*2);ctx.fill();ctx.restore()}
 // active spell indicators
}
function dash(){if(!player||player.dashCd>0)return;let dx=0,dy=0;if(mode==='pc'){if(keys.KeyW)dy--;if(keys.KeyS)dy++;if(keys.KeyA)dx--;if(keys.KeyD)dx++;}else{dx=stick.x;dy=stick.y}let l=Math.hypot(dx,dy);if(l<.1){const e=nearestEnemy(player.x,player.y);if(e){dx=player.x-e.x;dy=player.y-e.y;l=Math.hypot(dx,dy)}else{dx=1;dy=0;l=1}}player.vx=dx/l*620;player.vy=dy/l*620;player.dash=.16;player.dashCd=2.2;state.invuln=performance.now()+350;burst(player.x,player.y,'#8ceaff',12)}
function castActive(){if(!state.active.length)return;let idx=state.active.length>1?Math.floor(Math.random()*state.active.length):0;castSpell(state.active[idx])}
function menuQuick(){showModal('quick',`<h2>게임 메뉴</h2><div class="cards"><button class="pick-card" onclick="window.arcane.close();window.arcane.spells()"><span class="icon">✦</span><b>마법 관리</b><small>마법 장착·숙련도</small></button><button class="pick-card" onclick="window.arcane.summon()"><span class="icon">🎲</span><b>스킬 뽑기</b><small>마력석 ${manaBalance()}개</small></button><button class="pick-card" onclick="window.arcane.codex()"><span class="icon">📖</span><b>마법 도감</b><small>발견한 마법 확인</small></button><button class="pick-card" onclick="window.arcane.shop()"><span class="icon">⬆️</span><b>영구 성장</b><small>영구 능력 강화</small></button></div><div class="row" style="margin-top:14px"><button class="primary" onclick="window.arcane.close()">계속하기</button><button onclick="window.arcane.home()">메인 화면</button></div>`)}
$('pcMode').onclick=()=>{$('pcMode').classList.add('selected');$('tabletMode').classList.remove('selected')};
$('tabletMode').onclick=()=>{$('tabletMode').classList.add('selected');$('pcMode').classList.remove('selected')};
$('startBtn').onclick=()=>startGame(false);
$('continueBtn').onclick=()=>{startGame(false);showModal('continue',`<h2>저장 데이터</h2><p>영구 재화와 해금 마법은 자동 저장되어 있어. 새로운 탐험을 시작할까?</p><div class="row"><button class="primary" onclick="window.arcane.close()">탐험 시작</button><button onclick="window.arcane.home()">취소</button></div>`)};
$('resetSave').onclick=()=>{if(confirm('모든 저장 데이터를 초기화할까?')){save=freshSave();persist();toast('저장 데이터를 초기화했어.')}};
$('pauseBtn').onclick=showPause;$('spellBookBtn').onclick=showSpellBook;$('summonBtn').onclick=()=>drawSummon(1);$('codexBtn').onclick=showCodex;$('shopBtn').onclick=showShop;
$('touchAttack').addEventListener('pointerdown',e=>{e.preventDefault();touchAttack=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('touchAttack').addEventListener(ev,e=>{e.preventDefault();touchAttack=false}));
$('touchDash').addEventListener('pointerdown',e=>{e.preventDefault();dash()});$('touchSkill').addEventListener('pointerdown',e=>{e.preventDefault();castActive()});$('touchMenu').addEventListener('pointerdown',e=>{e.preventDefault();menuQuick()});
const base=$('stickBase'),knob=$('stickKnob');
base.addEventListener('pointerdown',e=>{e.preventDefault();stick.active=true;stick.id=e.pointerId;const r=base.getBoundingClientRect();stick.cx=r.left+r.width/2;stick.cy=r.top+r.height/2;base.setPointerCapture(e.pointerId);moveStick(e)});
base.addEventListener('pointermove',e=>{if(stick.active&&e.pointerId===stick.id){e.preventDefault();moveStick(e)}});
function moveStick(e){let dx=e.clientX-stick.cx,dy=e.clientY-stick.cy,l=Math.hypot(dx,dy),max=38;if(l>max){dx=dx/l*max;dy=dy/l*max}stick.x=dx/max;stick.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}
function endStick(e){if(stick.active&&e.pointerId===stick.id){stick.active=false;stick.id=null;stick.x=0;stick.y=0;knob.style.transform='translate(0,0)'}}
base.addEventListener('pointerup',endStick);base.addEventListener('pointercancel',endStick);
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!running)return;if(e.code==='Escape'){if(modalOpen)closeModal();else showPause()}if(e.code==='Space')dash();if(e.code==='KeyE')castActive();if(e.code==='Digit1'&&state.active[0])castSpell(state.active[0]);if(e.code==='Digit2'&&state.active[1])castSpell(state.active[1]);if(e.code==='Digit3'&&state.active[2])castSpell(state.active[2]);if(e.code==='Digit4'&&state.active[3])castSpell(state.active[3]);if(e.code==='KeyF')showFusion()});
addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;if(mode==='pc'){player&&(player.aimX=mouse.x,player.aimY=mouse.y)}});
canvas.addEventListener('pointerdown',e=>{if(mode==='pc'&&e.button===0){mouse.down=true;const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top}});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')mouse.down=false});
$('modalLayer').addEventListener('pointerdown',e=>{if(e.target===$('modalLayer')&&modalKind==='pause')closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)showPause()});
window.addEventListener('beforeunload',persist);
persist();
})();
</script>
